# SPIRE Server config (example, single-node local dev).
# Install dest: /etc/spire/server/server.conf

server {
    bind_address = "127.0.0.1"
    bind_port    = "8081"
    trust_domain = "@FS_NAME@.local"
    data_dir     = "/var/lib/spire/server"
    log_level    = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    KeyManager "memory" {
        plugin_data = {}
    }

    # Dev-only attestor — production: use TPM / x509pop / k8s_psat.
    NodeAttestor "join_token" {
        plugin_data {}
    }
}
