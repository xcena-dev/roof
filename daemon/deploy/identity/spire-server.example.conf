# SPIRE Server config (example, single-node local dev). install-deps.sh fills each @...@ from
# the host config.
# Install dest: /etc/spire/server/server.conf

server {
    bind_address = "@SERVER_ADDRESS@"
    bind_port    = "@SERVER_PORT@"
    trust_domain = "@TRUST_DOMAIN@"
    data_dir     = "/var/lib/spire/server"
    log_level    = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    KeyManager "memory" {
        plugin_data = {}
    }

    # Dev-only attestor — production: use TPM / x509pop / k8s_psat.
    NodeAttestor "join_token" {
        plugin_data {}
    }
}
