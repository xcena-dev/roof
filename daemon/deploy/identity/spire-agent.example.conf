# SPIRE Agent config (example, single-node local dev). install-deps.sh fills each @...@ from
# the host config.
# Install dest: /etc/spire/agent/agent.conf
# NOTE: socket under /run (not /tmp) — helper runs with PrivateTmp=true.

agent {
    data_dir          = "/var/lib/spire/agent"
    log_level         = "INFO"
    server_address    = "@SERVER_ADDRESS@"
    server_port       = "@SERVER_PORT@"
    trust_bundle_path = "/var/lib/spire/agent/bundle.crt"
    trust_domain      = "@TRUST_DOMAIN@"
    socket_path       = "/run/spire-agent/public/api.sock"
    # Delegated Identity API served on admin socket only (not workload socket).
    admin_socket_path = "@ADMIN_SOCKET@"

    # SPIFFE IDs allowed to call the Delegated Identity API (SubscribeToX509SVIDs).
    # Without this the agent rejects @DAEMON_NAME@ with PERMISSION_DENIED.
    # The setting is the agent's; the server's admin_ids is a different one.
    authorized_delegates = [
        "spiffe://@TRUST_DOMAIN@/@DAEMON_NAME@",
    ]
}

plugins {
    KeyManager "memory" {
        plugin_data {}
    }

    # Dev-only attestor — production: use TPM / AWS IID / k8s PSAT.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
