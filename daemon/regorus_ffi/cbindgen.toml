# SPDX-License-Identifier: Apache-2.0
# Renders include/daemon_regorus_ffi.h from the extern "C" surface in src/lib.rs.

language = "C++"
include_guard = "DAEMON_REGORUS_FFI_H"
# The C linkage lives beside lib.rs, which only src/engine.cpp includes. No header outside this
# crate names these.
namespaces = ["fsdaemon", "regorus", "abi"]
documentation = true
documentation_style = "c"
autogen_warning = "/* Generated by cbindgen from src/lib.rs. Edit that file, not this one. */"
header = """/* SPDX-License-Identifier: Apache-2.0 */
/* Copyright XCENA Inc. */"""

# The C++ side spells a record with a _t suffix, and Rust spells a type in UpperCamelCase.
# Renaming on the way out lets each side keep its own rule over the same opaque handle.
[export.rename]
"EngineHandle" = "EngineHandle_t"

